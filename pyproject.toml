[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-engine"
version = "0.1.0"
description = "A batch content engine for AI creators: character-LoRA keyframes + Wan 2.2 image-to-video on rented GPUs, with identity gates, a cost-per-piece ledger, view-driven format experiments and an MCP server for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oussama Farahi" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "typer>=0.12",
  "rich>=13",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
# Real face analysis (YuNet detector + AuraFace embedder, both commercially licensed weights)
vision = ["onnxruntime>=1.17"]
# OCR for the sign-text gate
ocr = ["rapidocr-onnxruntime>=1.3"]
# Claude vision judge for the subjective checks (hands, anatomy, light coherence)
judge = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "rapidocr-onnxruntime>=1.3", "anthropic>=0.40"]

[project.scripts]
ce = "creator_engine.cli:app"
creator-engine = "creator_engine.cli:app"
creator-engine-mcp = "creator_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creator_engine = ["data/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
