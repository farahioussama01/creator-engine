[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-engine"
version = "0.2.0"
description = "Character-LoRA stills -> checks -> Wan 2.2 clips -> checks -> keepers, with the cost of every render. No GPU needed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oussama Farahi" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "typer>=0.12",
  "fal-client>=0.5",
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ce = "creator_engine.cli:app"
creator-engine-mcp = "creator_engine.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
