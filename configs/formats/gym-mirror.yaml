id: gym-mirror
description: Gym mirror check between sets. For fitness characters.
keyframe_prompt: >-
  photo of {trigger}, {look}, standing in front of a gym mirror between sets, wearing {outfit},
  {scene}, {light}, phone photo, realistic skin texture with light sweat
motion_prompt: >-
  he rolls his shoulders, nods at the mirror and picks up a water bottle, handheld phone camera,
  natural gym ambience
scenes:
  - "in a concrete-walled strength gym"
  - "in a bright boutique gym with plants"
  - "in a garage gym with chalk on the floor"
outfits:
  - "a fitted black training tee and shorts"
  - "a grey tank top and joggers"
lights:
  - "overhead gym lighting"
  - "daylight from a roll-up door"
hooks:
  - "day 41. still showing up"
  - "the set nobody films"
caption: "{hook}"
hashtags: ["#gym", "#fitness"]
for_characters: [rafa]
head_ratio: [0.07, 0.20]
