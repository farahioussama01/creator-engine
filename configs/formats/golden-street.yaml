id: golden-street
description: Walking toward camera on a street at golden hour, backlit hair. Simple, high-retention.
keyframe_prompt: >-
  photo of {trigger}, {look}, walking toward the camera, wearing {outfit}, {scene}, {light},
  backlit hair, 35mm candid street photo, realistic skin texture
motion_prompt: >-
  she walks toward the camera at a relaxed pace and glances to the side, warm backlight,
  gentle handheld tracking shot, shallow depth of field
scenes:
  - "on a cobblestone street in Lisbon"
  - "on a tree-lined boulevard"
  - "on a quiet beach promenade"
  - "on a market street with string lights"
outfits:
  - "a white linen dress"
  - "a denim jacket and black jeans"
  - "a trench coat and loafers"
lights:
  - "low golden hour sun behind her"
  - "warm sunset light with lens flare"
hooks:
  - "this light only lasts 10 minutes"
  - "walking home the long way"
  - "golden hour does the editing"
caption: "{hook}"
hashtags: ["#goldenhour", "#citywalk"]
for_characters: [mila]
head_ratio: [0.07, 0.20]
