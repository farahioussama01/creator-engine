# Engine config for real pods. Usage: CE_CONFIG=configs/engine.gpu.yaml ce ...  (or -c configs/engine.gpu.yaml)
# See docs/gpu-runbook.md for the first run.
workdir: runs/gpu
db: runs/gpu/engine.db
characters_dir: configs/characters
formats_dir: configs/formats
prices: configs/prices.yaml
models_dir: models
workflows:
  keyframe: workflows/keyframe_zimage_lora.json
  video: workflows/i2v_wan22_lightx2v.json

analyzer: real           # YuNet + AuraFace; run `ce models download` once
scheduling: phased
poll_seconds: 0.5

profiles:
  draft:     { vid_width: 480, vid_height: 848, seconds: 3, keyframe_candidates: 1, max_video_attempts: 1 }
  standard:  { vid_width: 480, vid_height: 848, seconds: 5, keyframe_candidates: 2, max_video_attempts: 2 }
  hero:      { vid_width: 720, vid_height: 1280, seconds: 5, keyframe_candidates: 3, max_video_attempts: 2 }
  quality20: { vid_width: 480, vid_height: 848, seconds: 5, lightning: false, vid_steps: 20, vid_cfg: 3.5, split_step: 10 }

# Pods you started yourself (e.g. a RunPod pod running ComfyUI on 8188). With `--provision` these are
# ignored and the `runpod:` section rents fresh pods instead.
endpoints:
  - { name: pod-a, url: "https://REPLACE_POD_ID-8188.proxy.runpod.net", gpu: rtx4090, usd_per_hour: 0.34, concurrency: 2 }

runpod:
  api_key_env: RUNPOD_API_KEY
  image: "REPLACE/comfyui-image:tag"     # any image that serves ComfyUI on :8188 with models on the volume
  gpu_type_ids: ["NVIDIA GeForce RTX 4090"]
  gpu: rtx4090
  usd_per_hour: 0.34
  cloud_type: COMMUNITY
  interruptible: false
  network_volume_id: null                # put models on a network volume: pods boot without downloading 40 GB
  container_disk_gb: 40
  port: 8188
  count: 2
  concurrency: 2

# Real-image thresholds are NOT the simulator's. Start here, then calibrate on a hand-labelled sample
# (docs/quality-rubric.md). identity: use the value `ce identity enroll` suggests for each character.
gates:
  exposure:          { params: { max_clip_hi: 0.03, max_clip_lo: 0.08, mean_min: 45, mean_max: 200 } }
  face:              { params: { min_score: 0.7, max_faces: 1 } }
  sharpness:         { params: { min_laplacian_var: 40 } }
  skin_texture:      { params: { min_hf: 1.2 } }
  identity:          { params: { min_cosine: 0.45 } }
  sign_text:         { params: { min_confidence: 0.6 } }
  motion:            { params: { min_motion: 0.4, max_motion: 12.0 } }
  flicker:           { params: { max_luma_jump: 6.0 } }
  temporal_identity: { params: { min_cosine: 0.40, samples: 8, max_missing: 0.25 } }

budget:
  max_usd_per_batch: 15
  max_usd_per_day: 40

judge:
  enabled: true
  model: claude-haiku-5-5
  usd_per_mtok_in: 0.10
  usd_per_mtok_out: 0.50
  stages: [video]

publish:
  dry_run: true
  api_daily_cap: 50
  graph_host: graph.instagram.com
  api_version: v26.0
  media_base_url: null   # e.g. https://media.example.com/  (sync runs/gpu to a public bucket)
  accounts:
    - { handle: mila.wanders,  character: mila, timezone: Europe/Lisbon, daily_cap: 2,
        ig_user_id_env: IG_MILA_WANDERS_ID, token_env: IG_MILA_WANDERS_TOKEN }
    - { handle: mila.slowdays, character: mila, timezone: Europe/Madrid, daily_cap: 2,
        ig_user_id_env: IG_MILA_SLOWDAYS_ID, token_env: IG_MILA_SLOWDAYS_TOKEN }
